<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIFTY 50 — Live Option Chain Feed</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: monospace; padding: 16px; font-size: 13px; }
    .header { background: var(--card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .spot-box { font-size: 16px; font-weight: bold; color: #fff; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 6px; overflow: hidden; }
    th, td { padding: 6px 12px; text-align: center; border-bottom: 1px solid var(--border); }
    th { background: #21262d; text-transform: uppercase; font-size: 11px; }
    .call-ltp { color: #3fb950; font-weight: bold; }
    .put-ltp { color: #f85149; font-weight: bold; }
    .strike { font-weight: bold; color: #fff; background: rgba(255,255,255,0.02); }
    .atm-row { background: rgba(31, 111, 235, 0.25) !important; }
  </style>
</head>
<body>
  <div class="header">
    <div><strong>NIFTY FEED BROADCASTER</strong> | <span id="status">Connecting to 127.0.0.1:5555...</span></div>
    <div class="spot-box">Spot: <span id="spot">--</span> | ATM: <span id="atm">--</span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="color: #3fb950;">Call LTP</th>
        <th>Call Symbol</th>
        <th style="color: #fff;">Strike</th>
        <th>Put Symbol</th>
        <th style="color: #f85149;">Put LTP</th>
      </tr>
    </thead>
    <tbody id="chain-body"></tbody>
  </table>

  <script>
    async function updateChain() {
      try {
        const res = await fetch("http://127.0.0.1:5555/", { cache: "no-store" });
        const data = await res.json();
        
        const spot = parseFloat((data.spot && data.spot.ltp) || 0);
        document.getElementById("spot").textContent = spot > 0 ? spot.toFixed(2) : "Pre-Market";
        document.getElementById("status").textContent = `Last Tick: ${(data.spot && data.spot.updated) || "Waiting..."}`;

        const strikes = Object.keys(data.contracts || {}).map(Number).sort((a, b) => a - b);
        if (strikes.length === 0) return;

        // Fallback to middle strike if spot is 0 (pre-market)
        const centerStrike = spot > 0
          ? Math.round(spot / 50) * 50
          : strikes[Math.floor(strikes.length / 2)];

        document.getElementById("atm").textContent = spot > 0 ? centerStrike : `${centerStrike} (Est)`;

        const displayStrikes = strikes.filter(s => Math.abs(s - centerStrike) <= 750);

        document.getElementById("chain-body").innerHTML = displayStrikes.map(s => {
          const c = data.contracts[s.toString()];
          const ce = (c && c.CE) || {};
          const pe = (c && c.PE) || {};
          const isAtm = s === centerStrike;
          return `
            <tr class="${isAtm ? 'atm-row' : ''}">
              <td class="call-ltp">${ce.ltp !== null && ce.ltp !== undefined ? '₹' + Number(ce.ltp).toFixed(2) : '--'}</td>
              <td style="color: #8b949e; font-size: 11px;">${ce.symbol || '--'}</td>
              <td class="strike">${s}</td>
              <td style="color: #8b949e; font-size: 11px;">${pe.symbol || '--'}</td>
              <td class="put-ltp">${pe.ltp !== null && pe.ltp !== undefined ? '₹' + Number(pe.ltp).toFixed(2) : '--'}</td>
            </tr>
          `;
        }).join("");
      } catch(e) {
        document.getElementById("status").textContent = "Waiting for server.py at http://127.0.0.1:5555/...";
      }
    }
    setInterval(updateChain, 500);
    updateChain();
  </script>
</body>
</html>
